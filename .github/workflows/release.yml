name: Release

# Push a version tag (git tag v1.2.0 && git push --tags) to build the zip and
# upload it to GitHub Releases, CurseForge and Wago. A site is skipped while its
# project ID (in the .toc) or its token (in the repo's secrets) is missing.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
